spring.application.name=felanmalan-backend

# Databasanslutning
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/felanmalan
spring.datasource.username=admin
spring.datasource.password=admin

# JPA
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS för UI på servern + lokal dev
spring.mvc.cors.mapping=/api/**
spring.mvc.cors.allowed-origins=http://192.168.0.42:8082,http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.max-age=3600